name: Weekly YouTube Shorts ingestion

on:
  schedule:
    # Sundays at 06:00 UTC (about 1-2am US Eastern depending on DST)
    - cron: "0 6 * * 0"
  workflow_dispatch:
    # Allow manual trigger from the Actions tab too
    inputs:
      query:
        description: "YouTube search query"
        required: false
        default: "first amendment audit"
      target_count:
        description: "How many fresh clips to add"
        required: false
        default: "25"
      pack:
        description: "Pack id"
        required: false
        default: "yt_audits"

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          pip install --quiet -r tools/clipprep/yt_requirements.txt

      - name: Run YouTube Shorts pipeline
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          YT_PACK: ${{ github.event.inputs.pack || 'yt_audits' }}
          YT_QUERY: ${{ github.event.inputs.query || 'first amendment audit' }}
          YT_TARGET_COUNT: ${{ github.event.inputs.target_count || '25' }}
        run: python tools/clipprep/yt_shorts_pipeline.py
